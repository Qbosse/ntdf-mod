name: Jerdana Stage 1 Downgrade Shrink Pass 1

on:
  workflow_dispatch:
  push:
    branches:
      - jerdana-stage1-hardcoded-133-to-130-shrink-pass1

jobs:
  shrink-pass1:
    runs-on: ubuntu-latest
    env:
      OFFICIAL_PNACH_SHA256: 8eee249568fd94e05998b0dab30b8fa427e064845dd8b73f9e9f4f25865eb214
      OFFICIAL_ELF_SHA256: 43eba6baafba8aa20bfa2b2c9d8c7e5fcb24eb30ce2d9c92f2bbd4eea8bacf30
      DATA_GUARD: "0x30809C"
      FAILED_STAGE1_ARTIFACT_ID: "8243811599"
      CATEGORY_SWEEP_ARTIFACT_ID: "8238123666"
    steps:
      - uses: actions/checkout@v2

      - name: Setup original ps2dev environment
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs unzip
          wget https://github.com/ps2dev/ps2dev/releases/download/v1.1/ps2dev-ubuntu-latest.tar.gz
          sudo tar -xzf ps2dev-ubuntu-latest.tar.gz --directory /usr/local

      - name: Apply shrink pass 1 patch
        run: |
          mkdir -p reproducibility
          git apply --ignore-whitespace --check reproducibility/jerdana-stage1-hardcoded-downgrade-shrink-pass1.patch
          git apply --ignore-whitespace reproducibility/jerdana-stage1-hardcoded-downgrade-shrink-pass1.patch
          git diff -- mod/mod.cpp > reproducibility/applied-source-diff.patch
          git diff --stat -- mod/mod.cpp > reproducibility/applied-source-diff-stat.txt

      - name: Record shrink-pass plan
        run: |
          mkdir -p reproducibility
          {
            echo "probe=Jerdana Stage 1 hardcoded 133->130 downgrade shrink pass 1"
            echo "stage=Stage 1 only"
            echo "installed=no"
            echo "runtime_tested=no"
            echo "category=1"
            echo "write_target=slot+0x00 only"
            echo "unrelated_features_removed=no"
            echo "options_page_replacement=already used by rejected candidate and preserved here"
            echo "state_representation=saved_slot,original_config,target_config,outfit_state"
            echo "status_mapping=0 READY; 1 ACTIVE; 2 DONE; 3 REFUSED; 4 WRITEFAIL_SAFE; 5 ACTIVE_BADID; 6 UNSAFE"
            echo "controls=X apply; Square restore; Triangle back only when outfit_state is not unresolved; Circle unused; L2 unused"
            echo "one_apply_restore_cycle_per_session=yes"
            echo "compact_display=J%d a%d id:%d"
            echo "optimizations=single outfit_state replaces apply_active/test_complete/status; single display format replaces seven status strings; reference lookup helper removed; item id helper converted to macro; apply/restore made static inline; duplicate target display lookup removed; blocked Triangle sound feedback removed while unresolved"
            echo "failed_candidate_end=0x3082D4"
            echo "required_guard=0x30809C"
            echo "preferred_target=0x307FC4"
            echo "failed_candidate_contributors=outfit_item_id about 4 asm instructions; get_outfit_state about 33; stage1_apply about 105; stage1_restore about 67; status strings about 109 bytes; repeated helper calls in apply/restore/display"
          } | tee reproducibility/shrink-pass-report.txt

      - name: Build with original script
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin
          cd mod
          ./build.sh

      - name: Fetch official v2.4 baseline
        run: |
          mkdir -p reproducibility
          wget -O reproducibility/official-v2.4-934F9081.pnach https://github.com/monster860/ntdf-mod/releases/download/v2.4/934F9081.pnach
          wget -O reproducibility/official-v2.4-df_hack.elf https://github.com/monster860/ntdf-mod/releases/download/v2.4/df_hack.elf

      - name: Fetch comparison artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reproducibility/previous/failed-stage1 reproducibility/previous/category-sweep
          if curl -fL -H "Authorization: Bearer ${GITHUB_TOKEN}" -o reproducibility/previous/failed-stage1.zip "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${FAILED_STAGE1_ARTIFACT_ID}/zip"; then
            unzip -q reproducibility/previous/failed-stage1.zip -d reproducibility/previous/failed-stage1
            echo "failed_stage1_artifact_downloaded=yes" > reproducibility/previous-artifacts-report.txt
          else
            echo "failed_stage1_artifact_downloaded=no" > reproducibility/previous-artifacts-report.txt
          fi
          if curl -fL -H "Authorization: Bearer ${GITHUB_TOKEN}" -o reproducibility/previous/category-sweep.zip "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${CATEGORY_SWEEP_ARTIFACT_ID}/zip"; then
            unzip -q reproducibility/previous/category-sweep.zip -d reproducibility/previous/category-sweep
            echo "category_sweep_artifact_downloaded=yes" >> reproducibility/previous-artifacts-report.txt
          else
            echo "category_sweep_artifact_downloaded=no" >> reproducibility/previous-artifacts-report.txt
          fi

      - name: Compare hashes and layouts
        run: |
          mkdir -p reproducibility
          GENERATED_PNACH="$(sha256sum mod/934F9081.pnach | awk '{print $1}')"
          GENERATED_ELF="$(sha256sum mod/df_hack.elf | awk '{print $1}')"
          OFFICIAL_PNACH="$(sha256sum reproducibility/official-v2.4-934F9081.pnach | awk '{print $1}')"
          OFFICIAL_ELF="$(sha256sum reproducibility/official-v2.4-df_hack.elf | awk '{print $1}')"
          {
            echo "expected_official_pnach=${OFFICIAL_PNACH_SHA256}"
            echo "official_pnach=${OFFICIAL_PNACH}"
            echo "generated_pnach=${GENERATED_PNACH}"
            echo "expected_official_elf=${OFFICIAL_ELF_SHA256}"
            echo "official_elf=${OFFICIAL_ELF}"
            echo "generated_elf=${GENERATED_ELF}"
            wc -l reproducibility/official-v2.4-934F9081.pnach mod/934F9081.pnach
            sha256sum mod/934F9081.pnach mod/df_hack.elf mod/loader/patch.c reproducibility/jerdana-stage1-hardcoded-downgrade-shrink-pass1.patch
          } | tee reproducibility/hash-report.txt
          test "$OFFICIAL_PNACH" = "$OFFICIAL_PNACH_SHA256"
          test "$OFFICIAL_ELF" = "$OFFICIAL_ELF_SHA256"
          node scripts/compare-pnach-layout.js reproducibility/official-v2.4-934F9081.pnach mod/934F9081.pnach | tee reproducibility/layout-report.txt
          if test -f reproducibility/previous/failed-stage1/mod/934F9081.pnach; then
            node scripts/compare-pnach-layout.js reproducibility/previous/failed-stage1/mod/934F9081.pnach mod/934F9081.pnach | tee reproducibility/layout-vs-failed-stage1.txt
          else
            echo "failed Stage 1 PNACH unavailable" | tee reproducibility/layout-vs-failed-stage1.txt
          fi
          if test -f reproducibility/previous/category-sweep/mod/934F9081.pnach; then
            node scripts/compare-pnach-layout.js reproducibility/previous/category-sweep/mod/934F9081.pnach mod/934F9081.pnach | tee reproducibility/layout-vs-category-sweep.txt
          else
            echo "category sweep PNACH unavailable" | tee reproducibility/layout-vs-category-sweep.txt
          fi

      - name: Measure shrink pass size contributors
        run: |
          {
            echo "generated_status_strings:"
            grep -n "J%d a%d id:%d\|READY\|ACTIVE\|WRITEFAIL\|UNSAFE\|REFUSED" mod/mod.s || true
            echo
            echo "stage1_symbols_if_not_inlined:"
            grep -n "_Z12stage1_applyv\|_Z14stage1_restorev\|outfit_item_id\|get_outfit_state" mod/mod.s || true
          } | tee reproducibility/size-contributors-report.txt

