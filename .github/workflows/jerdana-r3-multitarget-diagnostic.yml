name: Jerdana R3 Multi-Target Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - jerdana-r3-multitarget-diagnostic

env:
  OFFICIAL_PNACH_SHA256: 8eee249568fd94e05998b0dab30b8fa427e064845dd8b73f9e9f4f25865eb214
  OFFICIAL_ELF_SHA256: 43eba6baafba8aa20bfa2b2c9d8c7e5fcb24eb30ce2d9c92f2bbd4eea8bacf30
  CORRECTED_SOURCE_SHA256: ace19be88030e2955b891ce7061a1ff194939fc6039204957bcea803b8adc15e
  PARENT_ARTIFACT_ID: "9549017849"
  PARENT_SOURCE_SHA256: e36ca23573c15b5a3676276a4206f255cc9c0eb0c501c1980d2675b49dc38406
  PARENT_PNACH_SHA256: f98d53e79b40c717c194bb60f3fc1e80a4ad7cdf066a13ac5524537666caa457
  PARENT_ELF_SHA256: 8ccbd95d452212356d9a2093cce28fe442ba4a158505f48bdb50cc1194491653
  PARENT_PATCH_C_SHA256: 94314f8b9b9e18fa3ccc9dfe80fb75d74555ca23420306c44574c579644b6889
  PARENT_MOD_II_SHA256: 7685591cd5e43580c0bbf64c2d69b88b1ba0dc47459ddbba5ce49dac0760a7f2
  PARENT_MOD_S_SHA256: 96d9c6b14cb4a2f659af8f2509713d964eb1ee9f141b48e7bab35b3b1ff6a348
  PARENT_MOD_O_SHA256: 1151bc2b5fb1ce5e3fa9f341ba954afdd14ead77c6b6b5569d7b3a7de712599a

jobs:
  official-v2-4-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Setup official v2.4 PS2DEV environment
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs
          wget https://github.com/ps2dev/ps2dev/releases/download/v1.1/ps2dev-ubuntu-latest.tar.gz
          sudo tar -xzf ps2dev-ubuntu-latest.tar.gz --directory /usr/local

      - name: Build unmodified official source
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin
          cd mod
          ./build.sh

      - name: Fetch and verify official release artifacts
        run: |
          wget -O reproducibility/official-v2.4-934F9081.pnach https://github.com/monster860/ntdf-mod/releases/download/v2.4/934F9081.pnach
          wget -O reproducibility/official-v2.4-df_hack.elf https://github.com/monster860/ntdf-mod/releases/download/v2.4/df_hack.elf
          test "$(sha256sum reproducibility/official-v2.4-934F9081.pnach | awk '{print $1}')" = "$OFFICIAL_PNACH_SHA256"
          test "$(sha256sum reproducibility/official-v2.4-df_hack.elf | awk '{print $1}')" = "$OFFICIAL_ELF_SHA256"

      - name: Require byte-identical official regression
        run: |
          test "$(sha256sum mod/934F9081.pnach | awk '{print $1}')" = "$OFFICIAL_PNACH_SHA256"
          test "$(sha256sum mod/df_hack.elf | awk '{print $1}')" = "$OFFICIAL_ELF_SHA256"
          test "$(wc -l < mod/934F9081.pnach)" -eq 3914
          node reproducibility/verify-r-mips26.js mod/mod.o 0x3043B0 mod/934F9081.pnach reproducibility/official-r-mips26-report.txt memset=0x2BFE8C
          node scripts/compare-pnach-layout.js reproducibility/official-v2.4-934F9081.pnach mod/934F9081.pnach | tee reproducibility/official-layout-report.txt
          {
            echo "official_regression=pass"
            sha256sum mod/934F9081.pnach mod/df_hack.elf mod/loader/patch.c mod/mod.ii mod/mod.s mod/mod.o elf_processor.js reproducibility/verify-r-mips26.js
            wc -l mod/934F9081.pnach
          } | tee reproducibility/official-regression-report.txt

      - name: Preserve official regression source state
        if: always()
        run: |
          git diff -- elf_processor.js mod/mod.cpp mod/make_mod.js mod/build.sh > reproducibility/official-source-diff.patch
          git status --short > reproducibility/official-git-status.txt
          git rev-parse HEAD > reproducibility/source-commit.txt

      - name: Upload official regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-v2.4-r3-multitarget-regression
          path: |
            mod/934F9081.pnach
            mod/df_hack.elf
            mod/mod.ii
            mod/mod.s
            mod/mod.o
            mod/loader/patch.c
            reproducibility/official-v2.4-934F9081.pnach
            reproducibility/official-v2.4-df_hack.elf
            reproducibility/official-r-mips26-report.txt
            reproducibility/official-layout-report.txt
            reproducibility/official-regression-report.txt
            reproducibility/official-source-diff.patch
            reproducibility/official-git-status.txt
            reproducibility/source-commit.txt
            reproducibility/verify-r-mips26.js
            elf_processor.js

  r3-multitarget-diagnostic:
    needs: official-v2-4-regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Setup official v2.4 PS2DEV environment
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs unzip
          wget https://github.com/ps2dev/ps2dev/releases/download/v1.1/ps2dev-ubuntu-latest.tar.gz
          sudo tar -xzf ps2dev-ubuntu-latest.tar.gz --directory /usr/local

      - name: Reconstruct exact parent and apply authorized source delta
        run: |
          git apply --ignore-whitespace --check reproducibility/jerdana-stage1-hardcoded-downgrade-shrink-pass3.patch
          git apply --ignore-whitespace reproducibility/jerdana-stage1-hardcoded-downgrade-shrink-pass3.patch
          test "$(sha256sum mod/mod.cpp | awk '{print $1}')" = "$CORRECTED_SOURCE_SHA256"
          git apply --ignore-whitespace --check reproducibility/jerdana-stage2-preview-safety-readback.patch
          git apply --ignore-whitespace reproducibility/jerdana-stage2-preview-safety-readback.patch
          test "$(sha256sum mod/mod.cpp | awk '{print $1}')" = "$PARENT_SOURCE_SHA256"
          mkdir -p reproducibility/previous/parent-source
          cp mod/mod.cpp reproducibility/previous/parent-source/mod.cpp
          git apply --ignore-whitespace --check reproducibility/jerdana-r3-multitarget-diagnostic.patch
          git apply --ignore-whitespace reproducibility/jerdana-r3-multitarget-diagnostic.patch
          diff -u reproducibility/previous/parent-source/mod.cpp mod/mod.cpp > reproducibility/source-diff-vs-stage2-parent.patch || test $? -eq 1
          git diff -- mod/mod.cpp > reproducibility/applied-candidate-source.patch
          git diff --stat -- mod/mod.cpp > reproducibility/applied-candidate-source-stat.txt

      - name: Build R3 multi-target diagnostic candidate
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin
          cd mod
          ./build.sh

      - name: Fetch verified corrected parent and official baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reproducibility/previous/parent
          curl -fL -H "Authorization: Bearer ${GITHUB_TOKEN}" -o reproducibility/previous/parent.zip "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${PARENT_ARTIFACT_ID}/zip"
          unzip -q reproducibility/previous/parent.zip -d reproducibility/previous/parent
          test "$(sha256sum reproducibility/previous/parent/mod/mod.cpp | awk '{print $1}')" = "$PARENT_SOURCE_SHA256"
          test "$(sha256sum reproducibility/previous/parent/mod/934F9081.pnach | awk '{print $1}')" = "$PARENT_PNACH_SHA256"
          test "$(sha256sum reproducibility/previous/parent/mod/df_hack.elf | awk '{print $1}')" = "$PARENT_ELF_SHA256"
          test "$(sha256sum reproducibility/previous/parent/mod/loader/patch.c | awk '{print $1}')" = "$PARENT_PATCH_C_SHA256"
          test "$(sha256sum reproducibility/previous/parent/mod/mod.ii | awk '{print $1}')" = "$PARENT_MOD_II_SHA256"
          test "$(sha256sum reproducibility/previous/parent/mod/mod.s | awk '{print $1}')" = "$PARENT_MOD_S_SHA256"
          test "$(sha256sum reproducibility/previous/parent/mod/mod.o | awk '{print $1}')" = "$PARENT_MOD_O_SHA256"
          wget -O reproducibility/official-v2.4-934F9081.pnach https://github.com/monster860/ntdf-mod/releases/download/v2.4/934F9081.pnach
          test "$(sha256sum reproducibility/official-v2.4-934F9081.pnach | awk '{print $1}')" = "$OFFICIAL_PNACH_SHA256"

      - name: Preserve generated disassembly and symbol sizes
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PATH=$PATH:$PS2DEV/ee/bin
          ee-objdump -dr mod/mod.o > reproducibility/mod-objdump-dr.txt
          ee-readelf -rWs mod/mod.o > reproducibility/mod-readelf-rws.txt
          {
            echo "candidate_symbols:"
            ee-nm -S mod/mod.o | grep -E 'stage1_action|ResumeGameHook|outfit_test|HandleResumeGameTrampoline' || true
            echo
            echo "parent_symbols:"
            ee-nm -S reproducibility/previous/parent/mod/mod.o | grep -E 'stage1_action|ResumeGameHook|outfit_test|HandleResumeGameTrampoline' || true
          } | tee reproducibility/symbol-size-report.txt

      - name: Verify relocations, generated safety semantics, hooks, and layout
        run: |
          node reproducibility/verify-r-mips26.js mod/mod.o 0x3043B0 mod/934F9081.pnach reproducibility/candidate-r-mips26-report.txt memset=0x2BFE8C
          node reproducibility/verify-r3-multitarget-diagnostic.js
          node scripts/compare-pnach-layout.js reproducibility/official-v2.4-934F9081.pnach mod/934F9081.pnach | tee reproducibility/layout-vs-official.txt
          node scripts/compare-pnach-layout.js reproducibility/previous/parent/mod/934F9081.pnach mod/934F9081.pnach | tee reproducibility/layout-vs-corrected-parent.txt

      - name: Record candidate artifact identities
        run: |
          {
            echo "build_environment=GitHub Actions official v2.4 PS2DEV v1.1"
            echo "parent_source=${PARENT_SOURCE_SHA256}"
            echo "authorized_change=bounded 127..133 target cycling; dynamic original/target validation; low-slot guards; generalized volatile apply/restore"
            echo "R_MIPS_26_fix_preserved=yes"
            echo "installed=no"
            echo "runtime_tested=no"
            sha256sum mod/mod.cpp mod/934F9081.pnach mod/df_hack.elf mod/loader/patch.c mod/mod.ii mod/mod.s mod/mod.o elf_processor.js reproducibility/jerdana-r3-multitarget-diagnostic.patch reproducibility/verify-r-mips26.js reproducibility/verify-r3-multitarget-diagnostic.js
            wc -l mod/934F9081.pnach
          } | tee reproducibility/candidate-hash-report.txt

      - name: Preserve final source state
        if: always()
        run: |
          git diff -- elf_processor.js mod/mod.cpp mod/make_mod.js mod/build.sh > reproducibility/candidate-source-diff.patch
          git status --short > reproducibility/candidate-git-status.txt
          git rev-parse HEAD > reproducibility/source-commit.txt

      - name: Upload R3 multi-target diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jerdana-r3-multitarget-diagnostic
          path: |
            mod/934F9081.pnach
            mod/df_hack.elf
            mod/mod.cpp
            mod/mod.ii
            mod/mod.s
            mod/mod.o
            mod/loader/patch.c
            reproducibility/jerdana-stage1-hardcoded-downgrade-shrink-pass3.patch
            reproducibility/jerdana-stage2-preview-safety-readback.patch
            reproducibility/jerdana-r3-multitarget-diagnostic.patch
            reproducibility/applied-candidate-source.patch
            reproducibility/applied-candidate-source-stat.txt
            reproducibility/source-diff-vs-stage2-parent.patch
            reproducibility/candidate-r-mips26-report.txt
            reproducibility/r3-multitarget-report.txt
            reproducibility/slot-sanity-report.txt
            reproducibility/dynamic-id-report.txt
            reproducibility/category-validation-report.txt
            reproducibility/same-target-no-op-report.txt
            reproducibility/apply-readback-report.txt
            reproducibility/restore-readback-report.txt
            reproducibility/target-cycling-report.txt
            reproducibility/dispatch-report.txt
            reproducibility/options-entry-isolation-report.txt
            reproducibility/unrelated-code-isolation-report.txt
            reproducibility/hook-address-report.txt
            reproducibility/hook-target-report.txt
            reproducibility/layout-vs-official.txt
            reproducibility/layout-vs-corrected-parent.txt
            reproducibility/candidate-hash-report.txt
            reproducibility/changed-external-patch-words.txt
            reproducibility/official-patch-addresses.txt
            reproducibility/parent-patch-addresses.txt
            reproducibility/candidate-patch-addresses.txt
            reproducibility/mod-objdump-dr.txt
            reproducibility/mod-readelf-rws.txt
            reproducibility/symbol-size-report.txt
            reproducibility/candidate-source-diff.patch
            reproducibility/candidate-git-status.txt
            reproducibility/source-commit.txt
            reproducibility/verify-r-mips26.js
            reproducibility/verify-r3-multitarget-diagnostic.js
            elf_processor.js
