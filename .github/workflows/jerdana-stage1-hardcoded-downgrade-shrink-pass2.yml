name: Jerdana Stage 1 Downgrade Shrink Pass 2

on:
  workflow_dispatch:
  push:
    branches:
      - jerdana-stage1-hardcoded-133-to-130-shrink-pass2

jobs:
  shrink-pass2:
    runs-on: ubuntu-latest
    env:
      OFFICIAL_PNACH_SHA256: 8eee249568fd94e05998b0dab30b8fa427e064845dd8b73f9e9f4f25865eb214
      OFFICIAL_ELF_SHA256: 43eba6baafba8aa20bfa2b2c9d8c7e5fcb24eb30ce2d9c92f2bbd4eea8bacf30
      PASS1_ARTIFACT_ID: "8244594037"
      CATEGORY_SWEEP_ARTIFACT_ID: "8238123666"
    steps:
      - uses: actions/checkout@v2

      - name: Setup official-style ps2dev environment
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs unzip
          wget https://github.com/ps2dev/ps2dev/releases/download/v1.1/ps2dev-ubuntu-latest.tar.gz
          sudo tar -xzf ps2dev-ubuntu-latest.tar.gz --directory /usr/local

      - name: Apply shrink pass 2 patch
        run: |
          git apply --ignore-whitespace --check reproducibility/jerdana-stage1-hardcoded-downgrade-shrink-pass2.patch
          git apply --ignore-whitespace reproducibility/jerdana-stage1-hardcoded-downgrade-shrink-pass2.patch
          git diff -- mod/mod.cpp > reproducibility/applied-source-diff.patch
          git diff --stat -- mod/mod.cpp > reproducibility/applied-source-diff-stat.txt

      - name: Record shrink pass 2 plan
        run: |
          {
            echo "probe=Jerdana Stage 1 hardcoded 133->130 downgrade shrink pass 2"
            echo "stage=Stage 1 only"
            echo "installed=no"
            echo "runtime_tested=no"
            echo "category=1"
            echo "write_target=slot+0x00 only"
            echo "unrelated_features_removed=no"
            echo "state=OutfitTestState(saved_slot,original_config,target_config,state)"
            echo "status=0 READY;1 ACTIVE;2 DONE;3 REFUSED;4 WRITEFAIL_SAFE;5 ACTIVE_BADID;6 UNSAFE"
            echo "controls=X apply; Square restore; Triangle back only when not unresolved; Circle unused; L2 unused"
            echo "one_cycle_per_session=yes"
            echo "display=J%d id:%d"
            echo "optimizations=contiguous state struct; merged apply/restore action; shared slot lookup; direct validated ID reads; removed redundant active display field"
            echo "pass1_end=0x308084"
            echo "required_guard=0x30809C"
            echo "preferred_target=0x307FC4"
          } | tee reproducibility/shrink-pass2-report.txt

      - name: Build with original script
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin
          cd mod
          ./build.sh

      - name: Fetch official baseline and reference artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          wget -O reproducibility/official-v2.4-934F9081.pnach https://github.com/monster860/ntdf-mod/releases/download/v2.4/934F9081.pnach
          wget -O reproducibility/official-v2.4-df_hack.elf https://github.com/monster860/ntdf-mod/releases/download/v2.4/df_hack.elf
          mkdir -p reproducibility/previous/pass1 reproducibility/previous/category-sweep
          if curl -fL -H "Authorization: Bearer ${GITHUB_TOKEN}" -o reproducibility/previous/pass1.zip "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${PASS1_ARTIFACT_ID}/zip"; then
            unzip -q reproducibility/previous/pass1.zip -d reproducibility/previous/pass1
            echo "pass1_artifact_downloaded=yes" > reproducibility/previous-artifacts-report.txt
          else
            echo "pass1_artifact_downloaded=no" > reproducibility/previous-artifacts-report.txt
          fi
          if curl -fL -H "Authorization: Bearer ${GITHUB_TOKEN}" -o reproducibility/previous/category-sweep.zip "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${CATEGORY_SWEEP_ARTIFACT_ID}/zip"; then
            unzip -q reproducibility/previous/category-sweep.zip -d reproducibility/previous/category-sweep
            echo "category_sweep_artifact_downloaded=yes" >> reproducibility/previous-artifacts-report.txt
          else
            echo "category_sweep_artifact_downloaded=no" >> reproducibility/previous-artifacts-report.txt
          fi

      - name: Compare hashes, layouts, hooks, and guard
        run: |
          GENERATED_PNACH="$(sha256sum mod/934F9081.pnach | awk '{print $1}')"
          GENERATED_ELF="$(sha256sum mod/df_hack.elf | awk '{print $1}')"
          OFFICIAL_PNACH="$(sha256sum reproducibility/official-v2.4-934F9081.pnach | awk '{print $1}')"
          OFFICIAL_ELF="$(sha256sum reproducibility/official-v2.4-df_hack.elf | awk '{print $1}')"
          {
            echo "expected_official_pnach=${OFFICIAL_PNACH_SHA256}"
            echo "official_pnach=${OFFICIAL_PNACH}"
            echo "generated_pnach=${GENERATED_PNACH}"
            echo "expected_official_elf=${OFFICIAL_ELF_SHA256}"
            echo "official_elf=${OFFICIAL_ELF}"
            echo "generated_elf=${GENERATED_ELF}"
            wc -l reproducibility/official-v2.4-934F9081.pnach mod/934F9081.pnach
            sha256sum mod/934F9081.pnach mod/df_hack.elf mod/loader/patch.c reproducibility/jerdana-stage1-hardcoded-downgrade-shrink-pass2.patch reproducibility/verify-shrink-pass2.js
          } | tee reproducibility/hash-report.txt
          test "$OFFICIAL_PNACH" = "$OFFICIAL_PNACH_SHA256"
          test "$OFFICIAL_ELF" = "$OFFICIAL_ELF_SHA256"
          node scripts/compare-pnach-layout.js reproducibility/official-v2.4-934F9081.pnach mod/934F9081.pnach | tee reproducibility/layout-report.txt
          test ! -f reproducibility/previous/pass1/mod/934F9081.pnach || node scripts/compare-pnach-layout.js reproducibility/previous/pass1/mod/934F9081.pnach mod/934F9081.pnach | tee reproducibility/layout-vs-pass1.txt
          test ! -f reproducibility/previous/category-sweep/mod/934F9081.pnach || node scripts/compare-pnach-layout.js reproducibility/previous/category-sweep/mod/934F9081.pnach mod/934F9081.pnach | tee reproducibility/layout-vs-category-sweep.txt
          node reproducibility/verify-shrink-pass2.js

      - name: Measure generated assembly and code size
        if: always()
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PATH=$PATH:$PS2DEV/ee/bin
          NM=mips64r5900el-ps2-elf-nm
          {
            echo "pass2_stage1_symbols:"
            $NM -S --size-sort mod/mod.o | grep -E 'stage1|outfit_test' || true
            echo
            echo "pass2_resume_hook:"
            $NM -S mod/mod.o | grep 'ResumeGameHook' || true
            echo
            echo "pass1_stage1_symbols:"
            test ! -f reproducibility/previous/pass1/mod/mod.o || $NM -S --size-sort reproducibility/previous/pass1/mod/mod.o | grep -E 'stage1|outfit_state|saved_slot|original_config|target_config' || true
            echo
            echo "pass1_resume_hook:"
            test ! -f reproducibility/previous/pass1/mod/mod.o || $NM -S reproducibility/previous/pass1/mod/mod.o | grep 'ResumeGameHook' || true
            echo
            echo "pass2_stage1_assembly_markers:"
            grep -n '_Z13stage1_actionb\|outfit_test\|J%d id:%d' mod/mod.s || true
            echo
            echo "pass1_stage1_assembly_markers:"
            test ! -f reproducibility/previous/pass1/mod/mod.s || grep -n '_Z12stage1_applyv\|_Z14stage1_restorev\|outfit_state\|J%d a%d id:%d' reproducibility/previous/pass1/mod/mod.s || true
          } | tee reproducibility/assembly-size-report.txt

      - name: Record post-build source state
        if: always()
        run: |
          git diff -- README.md .github/workflows/build.yml .github/workflows/jerdana-stage1-hardcoded-downgrade-shrink-pass2.yml elf_processor.js mod/build.sh mod/make_mod.js mod/mod.cpp mod/loader/loader.c docs/reproducibility-v2.4.md scripts/compare-pnach-layout.js reproducibility/verify-shrink-pass2.js > reproducibility/tracked-source-diff-after-build.patch
          git status --short > reproducibility/git-status-after-build.txt
          git rev-parse HEAD > reproducibility/source-commit.txt

      - name: Upload shrink pass 2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jerdana-stage1-hardcoded-downgrade-shrink-pass2
          path: |
            mod/934F9081.pnach
            mod/df_hack.elf
            mod/mod.o
            mod/mod.s
            mod/mod.ii
            mod/loader/patch.c
            reproducibility/official-v2.4-934F9081.pnach
            reproducibility/official-v2.4-df_hack.elf
            reproducibility/jerdana-stage1-hardcoded-downgrade-shrink-pass2.patch
            reproducibility/verify-shrink-pass2.js
            reproducibility/applied-source-diff.patch
            reproducibility/applied-source-diff-stat.txt
            reproducibility/hash-report.txt
            reproducibility/layout-report.txt
            reproducibility/layout-vs-pass1.txt
            reproducibility/layout-vs-category-sweep.txt
            reproducibility/address-report.txt
            reproducibility/official-patch-addresses.txt
            reproducibility/candidate-patch-addresses.txt
            reproducibility/shrink-pass2-report.txt
            reproducibility/assembly-size-report.txt
            reproducibility/previous-artifacts-report.txt
            reproducibility/tracked-source-diff-after-build.patch
            reproducibility/git-status-after-build.txt
            reproducibility/source-commit.txt
