name: Jerdana Input Edge Observability Readonly

on:
  workflow_dispatch:
  push:
    branches:
      - jerdana-input-edge-observability-readonly

jobs:
  input-edge-observability:
    runs-on: ubuntu-latest
    env:
      OFFICIAL_PNACH_SHA256: 8eee249568fd94e05998b0dab30b8fa427e064845dd8b73f9e9f4f25865eb214
      OFFICIAL_ELF_SHA256: 43eba6baafba8aa20bfa2b2c9d8c7e5fcb24eb30ce2d9c92f2bbd4eea8bacf30
      PASS3_ARTIFACT_ID: "9072630862"
      PASS3_PNACH_SHA256: 2df67d2d394a30b9af794dc35f5b236f59f5c6498efc9c1ca7505621859f8d2f
      PASS3_ELF_SHA256: 87f706dedc750aad624f7bad017aacc88c40eb4389ee947f622584e22889426a
      PARENT_ARTIFACT_ID: "9128915830"
      PARENT_PNACH_SHA256: b4834319ed768306aab777f14cdbd06857568c12b81b743d1d8f9384d0677cf6
      PARENT_ELF_SHA256: 3e0c4d679ce963a63d74602565faedf068f15b49475ea60eca71b4c6914b2534
      PARENT_PATCH_C_SHA256: b8d052b99b460539907680c0cf30c42d094b17cc37741a1231335687cf81fd8e
    steps:
      - uses: actions/checkout@v2

      - name: Set up official-style PS2DEV environment
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs unzip
          wget https://github.com/ps2dev/ps2dev/releases/download/v1.1/ps2dev-ubuntu-latest.tar.gz
          sudo tar -xzf ps2dev-ubuntu-latest.tar.gz --directory /usr/local

      - name: Apply the exact parent diagnostic and edge-input patch
        run: |
          mkdir -p /tmp/input-parent-source
          cp -a . /tmp/input-parent-source/repo
          (
            cd /tmp/input-parent-source/repo
            git apply --ignore-whitespace reproducibility/jerdana-stage1-hardcoded-downgrade-shrink-pass3.patch
            git apply --ignore-whitespace reproducibility/jerdana-stage1-input-observability-readonly.patch
          )
          git apply --ignore-whitespace --check reproducibility/jerdana-stage1-hardcoded-downgrade-shrink-pass3.patch
          git apply --ignore-whitespace reproducibility/jerdana-stage1-hardcoded-downgrade-shrink-pass3.patch
          git apply --ignore-whitespace --check reproducibility/jerdana-stage1-input-observability-readonly.patch
          git apply --ignore-whitespace reproducibility/jerdana-stage1-input-observability-readonly.patch
          git apply --ignore-whitespace --check reproducibility/jerdana-input-edge-observability-readonly.patch
          git apply --ignore-whitespace reproducibility/jerdana-input-edge-observability-readonly.patch
          git diff -- mod/mod.cpp > reproducibility/applied-source-diff.patch
          git diff --stat -- mod/mod.cpp > reproducibility/applied-source-diff-stat.txt
          diff -u /tmp/input-parent-source/repo/mod/mod.cpp mod/mod.cpp > reproducibility/source-diff-vs-parent.patch || test $? -eq 1

      - name: Record source-level input mapping evidence
        run: |
          {
            echo "controller_buttons_instant=0x4553DC"
            echo "This report records source uses only; it does not prove physical face-button mappings."
            echo
            grep -n -E 'controller_buttons_instant|cbi & 0x(10|20|40|80)' mod/mod.cpp || true
          } | tee reproducibility/input-bit-source-uses.txt

      - name: Build with the original v2.4 script
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin
          cd mod
          ./build.sh

      - name: Fetch and verify official and Pass-3 reference artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          wget -O reproducibility/official-v2.4-934F9081.pnach https://github.com/monster860/ntdf-mod/releases/download/v2.4/934F9081.pnach
          wget -O reproducibility/official-v2.4-df_hack.elf https://github.com/monster860/ntdf-mod/releases/download/v2.4/df_hack.elf
          mkdir -p reproducibility/previous/pass3
          mkdir -p reproducibility/previous/input-parent
          curl -fL -H "Authorization: Bearer ${GITHUB_TOKEN}" -o reproducibility/previous/pass3.zip "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${PASS3_ARTIFACT_ID}/zip"
          curl -fL -H "Authorization: Bearer ${GITHUB_TOKEN}" -o reproducibility/previous/input-parent.zip "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${PARENT_ARTIFACT_ID}/zip"
          unzip -q reproducibility/previous/pass3.zip -d reproducibility/previous/pass3
          unzip -q reproducibility/previous/input-parent.zip -d reproducibility/previous/input-parent
          test "$(sha256sum reproducibility/previous/pass3/mod/934F9081.pnach | awk '{print $1}')" = "$PASS3_PNACH_SHA256"
          test "$(sha256sum reproducibility/previous/pass3/mod/df_hack.elf | awk '{print $1}')" = "$PASS3_ELF_SHA256"
          test "$(sha256sum reproducibility/previous/input-parent/mod/934F9081.pnach | awk '{print $1}')" = "$PARENT_PNACH_SHA256"
          test "$(sha256sum reproducibility/previous/input-parent/mod/df_hack.elf | awk '{print $1}')" = "$PARENT_ELF_SHA256"
          test "$(sha256sum reproducibility/previous/input-parent/mod/loader/patch.c | awk '{print $1}')" = "$PARENT_PATCH_C_SHA256"
          {
            echo "pass3_artifact_downloaded_and_verified=yes"
            echo "input_observability_parent_artifact_downloaded_and_verified=yes"
          } > reproducibility/previous-artifacts-report.txt

      - name: Verify hashes, layout, hooks, and read-only reachability
        run: |
          GENERATED_PNACH="$(sha256sum mod/934F9081.pnach | awk '{print $1}')"
          GENERATED_ELF="$(sha256sum mod/df_hack.elf | awk '{print $1}')"
          OFFICIAL_PNACH="$(sha256sum reproducibility/official-v2.4-934F9081.pnach | awk '{print $1}')"
          OFFICIAL_ELF="$(sha256sum reproducibility/official-v2.4-df_hack.elf | awk '{print $1}')"
          {
            echo "expected_official_pnach=${OFFICIAL_PNACH_SHA256}"
            echo "official_pnach=${OFFICIAL_PNACH}"
            echo "generated_pnach=${GENERATED_PNACH}"
            echo "expected_official_elf=${OFFICIAL_ELF_SHA256}"
            echo "official_elf=${OFFICIAL_ELF}"
            echo "generated_elf=${GENERATED_ELF}"
            echo "expected_pass3_pnach=${PASS3_PNACH_SHA256}"
            echo "verified_pass3_pnach=$(sha256sum reproducibility/previous/pass3/mod/934F9081.pnach | awk '{print $1}')"
            echo "expected_pass3_elf=${PASS3_ELF_SHA256}"
            echo "verified_pass3_elf=$(sha256sum reproducibility/previous/pass3/mod/df_hack.elf | awk '{print $1}')"
            echo "expected_parent_pnach=${PARENT_PNACH_SHA256}"
            echo "verified_parent_pnach=$(sha256sum reproducibility/previous/input-parent/mod/934F9081.pnach | awk '{print $1}')"
            echo "expected_parent_elf=${PARENT_ELF_SHA256}"
            echo "verified_parent_elf=$(sha256sum reproducibility/previous/input-parent/mod/df_hack.elf | awk '{print $1}')"
            echo "expected_parent_patch_c=${PARENT_PATCH_C_SHA256}"
            echo "verified_parent_patch_c=$(sha256sum reproducibility/previous/input-parent/mod/loader/patch.c | awk '{print $1}')"
            wc -l reproducibility/official-v2.4-934F9081.pnach reproducibility/previous/pass3/mod/934F9081.pnach reproducibility/previous/input-parent/mod/934F9081.pnach mod/934F9081.pnach
            sha256sum mod/934F9081.pnach mod/df_hack.elf mod/loader/patch.c reproducibility/jerdana-input-edge-observability-readonly.patch reproducibility/verify-input-edge-observability.js
          } | tee reproducibility/hash-report.txt
          test "$OFFICIAL_PNACH" = "$OFFICIAL_PNACH_SHA256"
          test "$OFFICIAL_ELF" = "$OFFICIAL_ELF_SHA256"
          node scripts/compare-pnach-layout.js reproducibility/official-v2.4-934F9081.pnach mod/934F9081.pnach | tee reproducibility/layout-report.txt
          node scripts/compare-pnach-layout.js reproducibility/previous/pass3/mod/934F9081.pnach mod/934F9081.pnach | tee reproducibility/layout-vs-pass3.txt
          node reproducibility/verify-input-edge-observability.js

      - name: Record generated-code reachability evidence
        if: always()
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PATH=$PATH:$PS2DEV/ee/bin
          {
            echo "stage1_symbols:"
            ee-nm -S mod/mod.o | grep -E 'stage1_action|outfit_test|edge_instant|last_instant|sample_frames|input_capture_state' || true
            echo
            echo "assembly_markers:"
            grep -n -E '_Z13stage1_actionb|outfit_test|edge_instant|last_instant|sample_frames|input_capture_state|E:%x N:%x F:%d|4543452' mod/mod.s || true
            echo
            echo "stage1_call_sites:"
            grep -n -E 'jal[[:space:]]+_Z13stage1_actionb' mod/mod.s || true
            echo
            echo "options_source:"
            sed -n '/} else if(state == MENU_OPTIONS) {/,/^[[:space:]]*} else {/p' mod/mod.cpp
          } | tee reproducibility/generated-reachability-report.txt

      - name: Record post-build source state
        if: always()
        run: |
          git diff -- mod/mod.cpp > reproducibility/tracked-source-diff-after-build.patch
          git status --short > reproducibility/git-status-after-build.txt
          git rev-parse HEAD > reproducibility/source-commit.txt

      - name: Upload edge-input-observability artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jerdana-input-edge-observability-readonly
          path: |
            mod/934F9081.pnach
            mod/df_hack.elf
            mod/mod.o
            mod/mod.s
            mod/mod.ii
            mod/mod.cpp
            mod/loader/patch.c
            reproducibility/official-v2.4-934F9081.pnach
            reproducibility/official-v2.4-df_hack.elf
            reproducibility/jerdana-input-edge-observability-readonly.patch
            reproducibility/verify-input-edge-observability.js
            reproducibility/applied-source-diff.patch
            reproducibility/applied-source-diff-stat.txt
            reproducibility/source-diff-vs-parent.patch
            reproducibility/hash-report.txt
            reproducibility/layout-report.txt
            reproducibility/layout-vs-pass3.txt
            reproducibility/address-report.txt
            reproducibility/official-patch-addresses.txt
            reproducibility/pass3-patch-addresses.txt
            reproducibility/parent-patch-addresses.txt
            reproducibility/candidate-patch-addresses.txt
            reproducibility/input-bit-source-uses.txt
            reproducibility/input-edge-observability-report.txt
            reproducibility/generated-reachability-report.txt
            reproducibility/previous-artifacts-report.txt
            reproducibility/tracked-source-diff-after-build.patch
            reproducibility/git-status-after-build.txt
            reproducibility/source-commit.txt
